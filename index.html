<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        try {
          if (typeof window !== 'undefined' && window.fetch) {
            let _fetch = window.fetch;
            Object.defineProperty(window, 'fetch', {
              get() { return _fetch; },
              set(v) { _fetch = v; },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {
          // ignore
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0A0A0C" />
    <title>Srilanka Prayer Times</title>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.log('SW registration failed:', err);
          });
        });
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Anek+Tamil:wght@300;400;500;600;700;800&family=Cinzel:wght@600;700;800;900&family=Gemunu+Libre:wght@400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-premium-dark text-slate-100 font-['Anek_Tamil',sans-serif] antialiased selection:bg-purple-600 selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
